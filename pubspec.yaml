name: nirmaan
description: "Nirmaan — AI-Powered Business Operating System for Local Businesses"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Routing
  go_router: ^14.8.1

  # Backend
  supabase_flutter: ^2.18.3

  # Environment
  flutter_dotenv: ^5.2.1

  # Charts
  fl_chart: ^0.70.2

  # Typography
  google_fonts: ^6.2.1

  # Icons
  lucide_icons: ^0.257.0
  cupertino_icons: ^1.0.8

  # Scanner
  mobile_scanner: ^6.0.5

  # Sharing
  share_plus: ^10.1.4

  # PDF generation
  pdf: ^3.11.3

  # Excel generation
  excel: ^4.0.6

  # Internationalization / formatting
  intl: ^0.19.0

  # URL launcher
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
